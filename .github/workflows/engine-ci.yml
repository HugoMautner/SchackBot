name: Engine CI

on:
  push:
    branches: [ main ]
    paths:
      - 'engine/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # key should change if csproj/sln changes; adjust hashing globs to your repo shape if needed
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore engine/SchackBot.sln

      - name: Build
        run: dotnet build --configuration Release engine/SchackBot.sln --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build engine/SchackBot.sln
